{% extends "base.html" %}
{% block title %}Ingresar - KPIs{% endblock %}
{% block content %}
<div class="login-wrap">
  <div class="card login-card">
    <h1 class="login-title">📊 KPIs Cajeros</h1>
    <p class="muted">Iniciá sesión con tu legajo y contraseña.</p>
    <form method="post" class="form">
      <label>Legajo</label>
      <input name="legajo" type="text" autofocus required>
      <label>Contraseña</label>
      <input name="password" type="password" required>
      <button class="btn btn-primary" type="submit">Ingresar</button>
    </form>
  </div>
</div>
{% endblock %}
